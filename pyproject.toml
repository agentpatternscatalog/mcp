[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-agentic-patterns"
version = "0.2.0"
description = "MCP server exposing the Agentic Patterns Catalog (patterns, recipes, frameworks, methodologies, anti-patterns, examples) as resources and tools for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marco Nissen" }]
keywords = ["mcp", "agentic-patterns", "ai-agents", "claude", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.2",
]

[project.urls]
Homepage = "https://agentpatternscatalog.org"
Repository = "https://github.com/agentpatternscatalog/mcp"
Catalog = "https://github.com/agentpatternscatalog/patterns"
Issues = "https://github.com/agentpatternscatalog/mcp/issues"

[project.scripts]
mcp-agentic-patterns = "mcp_agentic_patterns.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agentic_patterns"]
# The data/ directory inside the package is populated by scripts/bundle_catalog.py
# before release; hatchling includes it automatically when present.
